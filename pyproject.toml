# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lexigate-core"
version = "0.1.0"
description = "LexiGate Core: semantic_map tooling, a PostgreSQL schema scanner, and a local month-end ask demo"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "LexiGate contributors" }]
requires-python = ">=3.10"
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
]
dependencies = [
  "psycopg[binary]>=3.1",
  "PyYAML>=6.0",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn>=0.27"]
test = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.27"]

[project.scripts]
lexigate = "lexigate.cli:main"

[project.urls]
Homepage = "https://github.com/lexigate/lexigate-core"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lexigate = ["spec/*.json", "demo/sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
